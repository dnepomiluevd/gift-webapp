<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Выбор получателя</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    /* Цвета берём из темы Telegram — так приложение само подстраивается под светлый/тёмный режим */
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f1f1f4);
    --section-bg:   var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
    --text:         var(--tg-theme-text-color, #000000);
    --hint:         var(--tg-theme-hint-color, #8e8e93);
    --separator:    rgba(128,128,128,.22);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--secondary-bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.3;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .header{ padding:18px 16px 8px; }
  .header h1{
    margin:0; font-size:13px; font-weight:600; letter-spacing:.4px;
    text-transform:uppercase; color:var(--hint);
  }
  .list{ background:var(--section-bg); overflow:hidden; }
  .row{
    display:flex; align-items:center; gap:12px;
    padding:0 16px; cursor:pointer; user-select:none;
    transition:background .12s ease;
  }
  .row:active{ background:var(--secondary-bg); }
  .avatar{
    flex:0 0 auto; width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:600; font-size:17px;
    background-size:cover; background-position:center;
  }
  .meta{
    flex:1 1 auto; min-width:0; padding:10px 0;
    display:flex; flex-direction:column; justify-content:center;
  }
  /* Разделитель с отступом слева (нативный стиль Telegram): рисуем только между строками */
  .row + .row .meta{ border-top:1px solid var(--separator); }
  .name{ font-size:16px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub{ font-size:13px; color:var(--hint); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chevron{ flex:0 0 auto; color:var(--hint); opacity:.5; display:flex; }
  .empty{ padding:48px 16px; text-align:center; color:var(--hint); }
</style>
</head>
<body>
  <div class="header"><h1>Выберите получателя</h1></div>
  <div class="list" id="list"></div>

<script>
(function(){
  "use strict";

  // Mock-данные для предпросмотра. Замените на реальные объекты из вашего бэкенда.
  // Обязательные поля: id (строка/число) и name. Необязательные: username, photo_url.
  const USERS = [
    { id: "123456789", name: "Анна Ковалёва",  username: "@anna_k"   },
    { id: "234567890", name: "Дмитрий Орлов",   username: "@dmitry"   },
    { id: "345678901", name: "Мария Соколова",  username: "@mariya_s" },
    { id: "456789012", name: "Иван Петров",     username: "@ivan"     },
    { id: "567890123", name: "Ольга Новикова",  username: "@olga_n"   },
  ];

  const tg = window.Telegram ? window.Telegram.WebApp : null;

  // ready() сообщает клиенту, что интерфейс отрисован; expand() разворачивает
  // окно на всю высоту — иначе меню открывается наполовину и выглядит не нативно.
  if (tg){ tg.ready(); tg.expand(); }

  // Цвет аватара считаем детерминированно из id, чтобы он не «прыгал» между рендерами
  // и его не нужно было хранить в данных.
  const PALETTE = ["#e17076","#7bc862","#65aadd","#a695e7","#ee7aae","#faa774","#6ec9cb"];
  function colorFor(key){
    let h = 0;
    for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }
  function initials(name){
    const p = name.trim().split(/\s+/);
    return ((p[0]?.[0] || "") + (p[1]?.[0] || "")).toUpperCase();
  }

  let locked = false; // защита от повторного тапа, пока окно закрывается

  function pick(user){
    if (locked) return;
    locked = true;

    if (tg){
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
      // sendData отправляет строку боту в message.web_app_data.data.
      // ВАЖНО: работает только если WebApp открыт через Reply-кнопку клавиатуры (KeyboardButton).
      tg.sendData(String(user.id));
      tg.close();
    } else {
      // Запуск вне Telegram (локальная проверка в браузере) — просто показываем выбор.
      alert("Выбран id: " + user.id);
      locked = false;
    }
  }

  function render(users){
    const list = document.getElementById("list");
    if (!users.length){
      list.outerHTML = '<div class="empty">Список пуст</div>';
      return;
    }
    const frag = document.createDocumentFragment();
    for (const user of users){
      const row = document.createElement("div");
      row.className = "row";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      if (user.photo_url){
        avatar.style.backgroundImage = `url("${user.photo_url}")`;
      } else {
        avatar.style.background = colorFor(String(user.id));
        avatar.textContent = initials(user.name);
      }

      const meta = document.createElement("div");
      meta.className = "meta";
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = user.name;
      meta.appendChild(name);
      if (user.username){
        const sub = document.createElement("div");
        sub.className = "sub";
        sub.textContent = user.username;
        meta.appendChild(sub);
      }

      const chevron = document.createElement("div");
      chevron.className = "chevron";
      chevron.innerHTML = '<svg width="8" height="14" viewBox="0 0 8 14" fill="none"><path d="M1 1l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      row.append(avatar, meta, chevron);
      row.addEventListener("click", () => pick(user));
      frag.appendChild(row);
    }
    list.appendChild(frag);
  }

  render(USERS);
})();
</script>
</body>
</html>
